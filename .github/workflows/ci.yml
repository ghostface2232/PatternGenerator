name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # docs/ is the deployed site and must be committed alongside the source that produced it.
      - name: Verify committed docs/ matches the build
        run: |
          if ! git diff --quiet -- docs/; then
            echo "docs/ is stale. Run 'npm run build' and commit the result." >&2
            git --no-pager diff --stat -- docs/
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
